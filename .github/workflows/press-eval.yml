name: Press Eval (PR)

on:
  pull_request:
    branches: [main]

concurrency:
  group: press-eval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Only run if eval secrets are configured
    if: ${{ vars.HAS_EVAL_SECRETS == 'true' }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run Press evals (quick tier)
        # `--no-install` so this runs the lockfile's tsx rather than fetching an
        # unpinned one from the registry into a job holding a provider key.
        run: npx --no-install tsx src/eval-pipeline.ts --tier quick --concurrency 3
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        timeout-minutes: 8

      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eval-results-${{ github.sha }}
          path: eval-results/
          retention-days: 30
